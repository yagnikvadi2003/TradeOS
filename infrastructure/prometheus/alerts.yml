groups:
  - name: tradeos-market-data
    rules:
      - alert: MarketProviderDisconnected
        expr: market_provider_connection == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: 'Upstream market feed disconnected for 2 minutes' }
      - alert: MarketDataStale
        expr: market_data_staleness_seconds > 30
        for: 1m
        labels: { severity: warning }
        annotations: { summary: 'No provider frame for more than 30 s during session' }
      - alert: MarketReconnectStorm
        expr: increase(market_provider_reconnect_total[10m]) > 10
        labels: { severity: warning }
        annotations: { summary: 'More than 10 upstream reconnects in 10 minutes' }
      - alert: MarketDataDropping
        expr: rate(market_data_dropped_total[5m]) > 1
        labels: { severity: warning }
        annotations: { summary: 'Bounded client queues are dropping updates (slow consumers)' }
      - alert: InvalidProviderPayloads
        expr: increase(market_data_invalid_total[15m]) > 0
        labels: { severity: warning }
        annotations: { summary: 'Provider frames failing validation — contract drift?' }
      - alert: HttpErrorRate
        expr: rate(http_errors_total{class="5xx"}[5m]) > 0.05
        labels: { severity: warning }
        annotations: { summary: '5xx rate above 0.05/s' }
      - alert: RedisUnavailable
        expr: redis_available == 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: 'Redis configured but unreachable; running single-instance' }
      - alert: BackendMemoryHigh
        expr: process_memory_rss_bytes > 400 * 1024 * 1024
        for: 10m
        labels: { severity: warning }
        annotations: { summary: 'Backend RSS above 400 MiB' }
